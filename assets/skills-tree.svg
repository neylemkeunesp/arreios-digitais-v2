  <text x="40" y="280" fill="#cdd6f4" font-size="14" font-weight="600" font-family="-apple-system,system-ui,sans-serif">Cada skill = 1 pasta com SKILL.md (YAML frontmatter + corpo)</text>

  <rect x="40" y="300" width="820" height="92" rx="8" fill="#313244" stroke="#45475a" stroke-width="1"/>
  <text x="60" y="328" fill="#94e2d5" font-size="13" font-weight="700">---</text>
  <text x="80" y="328" fill="#cdd6f4" font-size="12">name: diagnose-crash</text>
  <text x="60" y="350" fill="#94e2d5" font-size="13" font-weight="700">---</text>
  <text x="80" y="350" fill="#cdd6f4" font-size="12">description: Use when investigating crashes, BSODs,</text>
  <text x="80" y="370" fill="#cdd6f4" font-size="12">  gateway loops, or system hangs on this Linux/Omarchy box.</text>
