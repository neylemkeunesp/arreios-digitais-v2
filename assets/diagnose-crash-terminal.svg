<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="ui-monospace,Menlo,Consolas,monospace">
  <rect width="900" height="480" fill="#000000"/>
  <rect width="900" height="32" fill="#161b22"/>
  <text x="450" y="20" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="600">diagnose-crash skill · terminal</text>

  <!-- command -->
  <text x="24" y="68" fill="#79c0ff" font-size="16" font-weight="600">$</text>
  <text x="46" y="68" fill="#ffffff" font-size="16" font-weight="500">/skill</text>
  <text x="116" y="68" fill="#ffa657" font-size="16" font-weight="600">diagnose-crash</text>
  <text x="24" y="92" fill="#d0d7de" font-size="14">▸ Investigating laptop crash at 09:14 today</text>

  <!-- step -->
  <text x="24" y="132" fill="#56d364" font-size="14" font-weight="600">[+]</text>
  <text x="56" y="132" fill="#d0d7de" font-size="14" font-weight="500">Collecting evidence</text>
  <text x="48" y="156" fill="#d0d7de" font-size="13">  · journalctl --since today -p err</text>
  <text x="48" y="178" fill="#d0d7de" font-size="13">  · last -F -n 10</text>
  <text x="48" y="200" fill="#d0d7de" font-size="13">  · uptime / boot IDs</text>

  <!-- result -->
  <text x="24" y="240" fill="#ffa657" font-size="14" font-weight="600">[!]</text>
  <text x="56" y="240" fill="#ffa657" font-size="14" font-weight="700">ROOT CAUSE IDENTIFIED</text>
  <text x="24" y="264" fill="#ffffff" font-size="13">  hermes-gateway.service restart counter = 1155</text>
  <text x="24" y="284" fill="#ffffff" font-size="13">  Rogue gateway (linus, PID 2526004) holding host</text>
  <text x="24" y="304" fill="#ffffff" font-size="13">  Cold boot forced at 09:14:22 (no graceful shutdown)</text>

  <!-- fix -->
  <text x="24" y="344" fill="#56d364" font-size="14" font-weight="600">[+]</text>
  <text x="56" y="344" fill="#56d364" font-size="14" font-weight="700">RECOMMENDED FIX</text>
  <text x="24" y="368" fill="#79c0ff" font-size="14" font-weight="600">$</text>
  <text x="46" y="368" fill="#ffffff" font-size="14">hermes gateway migrate --multiplex</text>
  <text x="24" y="390" fill="#79c0ff" font-size="14" font-weight="600">$</text>
  <text x="46" y="390" fill="#ffffff" font-size="14">sudo systemctl disable hermes-gateway.service</text>

  <!-- footer -->
  <text x="24" y="430" fill="#d0d7de" font-size="12">Skill saved: ~/.hermes/profiles/linus/skills/diagnose-crash/</text>
  <text x="24" y="450" fill="#56d364" font-size="14" font-weight="600">✓ Diagnostic complete in 87s · Skill updated</text>
</svg>