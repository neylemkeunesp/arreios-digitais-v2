<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="-apple-system,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="540" fill="url(#bg)"/>

  <!-- título -->
  <text x="40" y="36" fill="#cdd6f4" font-size="19" font-weight="600">Omarchy: o SO controlado por agentes</text>
  <text x="40" y="58" fill="#a6adc8" font-size="12">Linux/Omarchy + Hermes: o sistema operacional vira uma skill</text>

  <!-- Camada 1: SO (Omarchy) -->
  <rect x="40" y="86" width="920" height="200" rx="12" fill="#313244" stroke="#89b4fa" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="56" y="112" fill="#89b4fa" font-size="13" font-weight="700">SISTEMA OPERACIONAL · Omarchy 4.0.1 (Arch-based, kernel 7.x)</text>

  <!-- 4 cards do SO (compactos, cabem em 920px) -->
  <g font-size="11">
    <rect x="60"  y="130" width="210" height="50" rx="8" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="72"  y="151" fill="#a6e3a1" font-weight="700">drivers NVIDIA</text>
    <text x="72"  y="170" fill="#a6adc8">RTX 3060 · driver 610</text>

    <rect x="290" y="130" width="210" height="50" rx="8" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1.5"/>
    <text x="302" y="151" fill="#cba6f7" font-weight="700">Hyprland (WM)</text>
    <text x="302" y="170" fill="#a6adc8">keybindings · layouts</text>

    <rect x="520" y="130" width="210" height="50" rx="8" fill="#1e1e2e" stroke="#94e2d5" stroke-width="1.5"/>
    <text x="532" y="151" fill="#94e2d5" font-weight="700">network/wifi</text>
    <text x="532" y="170" fill="#a6adc8">NetworkManager · VPN</text>

    <rect x="750" y="130" width="195" height="50" rx="8" fill="#1e1e2e" stroke="#fab387" stroke-width="1.5"/>
    <text x="762" y="151" fill="#fab387" font-weight="700">pacman / AUR</text>
    <text x="762" y="170" fill="#a6adc8">flatpak · snap</text>

    <!-- Sub-componentes -->
    <rect x="60"  y="200" width="280" height="70" rx="8" fill="#1e1e2e" stroke="#45475a"/>
    <text x="74"  y="222" fill="#cdd6f4" font-size="12" font-weight="700">systemd</text>
    <text x="74"  y="240" fill="#a6adc8" font-size="10">services · timers</text>
    <text x="74"  y="256" fill="#a6adc8" font-size="10">journald</text>

    <rect x="360" y="200" width="280" height="70" rx="8" fill="#1e1e2e" stroke="#45475a"/>
    <text x="374" y="222" fill="#cdd6f4" font-size="12" font-weight="700">kernel modules</text>
    <text x="374" y="240" fill="#a6adc8" font-size="10">nvidia · nvidia-drm</text>
    <text x="374" y="256" fill="#a6adc8" font-size="10">v4l2</text>

    <rect x="660" y="200" width="280" height="70" rx="8" fill="#1e1e2e" stroke="#45475a"/>
    <text x="674" y="222" fill="#cdd6f4" font-size="12" font-weight="700">filesystem (BTRFS)</text>
    <text x="674" y="240" fill="#a6adc8" font-size="10">snapshots · subvolumes</text>
    <text x="674" y="256" fill="#a6adc8" font-size="10">fstab</text>
  </g>

  <!-- Camada 2: Hermes (6 comandos em 2 fileiras) -->
  <rect x="40" y="306" width="920" height="160" rx="12" fill="#313244" stroke="#f5c2e7" stroke-width="2"/>
  <text x="56" y="332" fill="#f5c2e7" font-size="13" font-weight="700">HERMES · agente de controle do SO</text>
  <text x="56" y="350" fill="#a6adc8" font-size="11">executa comandos, lê logs, instala pacotes, edita dotfiles — tudo via linguagem natural</text>

  <g font-size="11" font-family="ui-monospace,Menlo,Consolas,monospace">
    <rect x="60"  y="365" width="285" height="28" rx="6" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
    <text x="72"  y="384" fill="#a6e3a1">$ sudo pacman -S nvidia-dkms</text>

    <rect x="360" y="365" width="285" height="28" rx="6" fill="#1e1e2e" stroke="#cba6f7" stroke-width="1"/>
    <text x="372" y="384" fill="#cba6f7">$ hyprctl reload</text>

    <rect x="660" y="365" width="280" height="28" rx="6" fill="#1e1e2e" stroke="#f9e2af" stroke-width="1"/>
    <text x="672" y="384" fill="#f9e2af">$ vim ~/.config/hypr/...</text>

    <rect x="60"  y="403" width="285" height="28" rx="6" fill="#1e1e2e" stroke="#94e2d5" stroke-width="1"/>
    <text x="72"  y="422" fill="#94e2d5">$ nmcli wifi connect</text>

    <rect x="360" y="403" width="285" height="28" rx="6" fill="#1e1e2e" stroke="#fab387" stroke-width="1"/>
    <text x="372" y="422" fill="#fab387">$ systemctl restart NM</text>

    <rect x="660" y="403" width="280" height="28" rx="6" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1"/>
    <text x="672" y="422" fill="#f38ba8">$ btrfs snapshot create</text>
  </g>

  <!-- Faixa de destaque com bastante respiro do rodapé -->
  <rect x="60" y="485" width="880" height="38" rx="19" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="500" y="510" text-anchor="middle" fill="#a6e3a1" font-size="14" font-weight="700">você fala em linguagem natural · o agente executa · 24/7</text>
</svg>