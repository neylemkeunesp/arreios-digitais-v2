<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="-apple-system,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="harnessBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a6e3a1"/>
      <stop offset="1" stop-color="#94e2d5"/>
    </linearGradient>
    <linearGradient id="modelBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f9e2af"/>
      <stop offset="1" stop-color="#fab387"/>
    </linearGradient>
  </defs>
  <rect width="900" height="360" fill="url(#bg)"/>

  <!-- title -->
  <text x="40" y="40" fill="#cdd6f4" font-size="20" font-weight="600">Performance gain</text>
  <text x="40" y="68" fill="#a6adc8" font-size="14">Harness iteration &gt; Model upgrade (same vendor)</text>

  <!-- Harness iteration card -->
  <rect x="40" y="100" width="320" height="80" rx="8" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="60" y="128" fill="#a6e3a1" font-size="16" font-weight="700">Harness iteration</text>
  <text x="60" y="152" fill="#cdd6f4" font-size="13">Same model, new harness</text>
  <text x="60" y="170" fill="#94e2d5" font-size="11" font-style="italic">6× performance gap</text>

  <!-- Model upgrade card -->
  <rect x="40" y="220" width="320" height="80" rx="8" fill="#313244" stroke="#f9e2af" stroke-width="2"/>
  <text x="60" y="248" fill="#f9e2af" font-size="16" font-weight="700">Model upgrade</text>
  <text x="60" y="272" fill="#cdd6f4" font-size="13">Same vendor, new model</text>
  <text x="60" y="290" fill="#fab387" font-size="11" font-style="italic">1.2× performance gap</text>

  <!-- Arrow from harness card -->
  <line x1="360" y1="140" x2="450" y2="140" stroke="#a6e3a1" stroke-width="3"/>
  <polygon points="450,134 462,140 450,146" fill="#a6e3a1"/>

  <!-- Arrow from model card -->
  <line x1="360" y1="260" x2="450" y2="260" stroke="#f9e2af" stroke-width="3"/>
  <polygon points="450,254 462,260 450,266" fill="#f9e2af"/>

  <!-- Performance bars -->
  <!-- Harness bar (large) -->
  <rect x="470" y="100" width="380" height="80" rx="8" fill="#313244"/>
  <rect x="470" y="120" width="380" height="40" rx="4" fill="url(#harnessBar)"/>
  <text x="660" y="146" text-anchor="middle" fill="#1e1e2e" font-size="24" font-weight="800">6×</text>
  <text x="660" y="174" text-anchor="middle" fill="#cdd6f4" font-size="11">Performance gain</text>

  <!-- Model bar (small) -->
  <rect x="470" y="220" width="380" height="80" rx="8" fill="#313244"/>
  <rect x="470" y="240" width="76" height="40" rx="4" fill="url(#modelBar)"/>
  <text x="508" y="266" text-anchor="middle" fill="#1e1e2e" font-size="20" font-weight="800">1.2×</text>
  <text x="660" y="294" text-anchor="middle" fill="#a6adc8" font-size="11">Performance gain (same vendor)</text>

  <!-- bottom note -->
  <text x="450" y="340" text-anchor="middle" fill="#6c7086" font-size="12" font-style="italic">Stanford/Tsinghua 2026: 6× gap from harness design alone</text>
</svg>