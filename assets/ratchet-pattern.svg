<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="1" stop-color="#181825"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#89b4fa"/></marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94e2d5"/></marker>
    <marker id="arrPeach" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fab387"/></marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a6e3a1"/></marker>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>

  <text x="40" y="40" fill="#cdd6f4" font-size="18" font-weight="600">Ratchet pattern</text>
  <text x="40" y="62" fill="#a6adc8" font-size="13">Cada falha vira regra permanente no AGENTS.md</text>

  <!-- Step 1: tarefa -->
  <rect x="320" y="100" width="240" height="50" rx="25" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
  <text x="440" y="131" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="700">1. tarefa</text>
  <line x1="440" y1="150" x2="440" y2="178" stroke="#89b4fa" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Step 2: agente tenta -->
  <rect x="320" y="184" width="240" height="50" rx="25" fill="#313244" stroke="#cba6f7" stroke-width="2.5"/>
  <text x="440" y="215" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="700">2. agente tenta</text>
  <line x1="440" y1="234" x2="440" y2="262" stroke="#89b4fa" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Decision diamond -->
  <polygon points="440,268 510,308 440,348 370,308" fill="#313244" stroke="#f9e2af" stroke-width="2.5"/>
  <text x="440" y="306" text-anchor="middle" fill="#f9e2af" font-size="14" font-weight="700">OK?</text>
  <text x="440" y="322" text-anchor="middle" fill="#a6adc8" font-size="11">decision</text>

  <!-- Success branch (right, teal/green) -->
  <line x1="510" y1="308" x2="610" y2="308" stroke="#94e2d5" stroke-width="2.5" marker-end="url(#arrTeal)"/>
  <text x="560" y="298" text-anchor="middle" fill="#94e2d5" font-size="13" font-weight="600">sim</text>
  <rect x="610" y="282" width="200" height="50" rx="25" fill="#313244" stroke="#a6e3a1" stroke-width="2.5"/>
  <text x="710" y="313" text-anchor="middle" fill="#a6e3a1" font-size="14" font-weight="700">3. sucesso ✓</text>

  <!-- Failure branch (left, peach) -->
  <line x1="370" y1="308" x2="270" y2="308" stroke="#fab387" stroke-width="2.5" marker-end="url(#arrPeach)"/>
  <text x="320" y="298" text-anchor="middle" fill="#fab387" font-size="13" font-weight="600">não</text>
  <rect x="60" y="282" width="210" height="50" rx="10" fill="#313244" stroke="#fab387" stroke-width="2.5"/>
  <text x="165" y="305" text-anchor="middle" fill="#fab387" font-size="14" font-weight="700">4. vira regra em</text>
  <text x="165" y="322" text-anchor="middle" fill="#cdd6f4" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace">AGENTS.md</text>

  <!-- Feedback loop: regra volta para "agente tenta" -->
  <path d="M 165 282 Q 60 130 320 162" fill="none" stroke="#fab387" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrPeach)"/>
  <text x="120" y="200" text-anchor="middle" fill="#fab387" font-size="11" font-weight="600">próxima vez:</text>
  <text x="120" y="216" text-anchor="middle" fill="#fab387" font-size="11" font-weight="600">já carrega a regra</text>

  <!-- Resultado final -->
  <rect x="240" y="400" width="400" height="60" rx="30" fill="#313244" stroke="#a6e3a1" stroke-width="3"/>
  <text x="440" y="432" text-anchor="middle" fill="#a6e3a1" font-size="17" font-weight="700">Próxima vez: nunca mais</text>
  <text x="440" y="450" text-anchor="middle" fill="#a6adc8" font-size="11">o arreio se ajusta ao terreno</text>
  <line x1="710" y1="332" x2="600" y2="400" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrGreen)"/>
  <line x1="165" y1="332" x2="280" y2="400" stroke="#a6e3a1" stroke-width="2" marker-end="url(#arrGreen)"/>
</svg>