  <text x="24" y="328" fill="#ff7b72" font-size="17" font-weight="700"># Telegram Bot Operations</text>

  <text x="24" y="364" fill="#79c0ff" font-size="16" font-weight="700">## Common pitfalls</text>
  <text x="24" y="392" fill="#ffffff" font-size="14">- Never kill the gateway PID directly — use</text>
  <text x="36" y="412" fill="#a5d6ff" font-size="14" font-weight="500">`hermes gateway restart`</text>
  <text x="172" y="412" fill="#ffffff" font-size="14">to avoid polling conflict.</text>
  <text x="24" y="436" fill="#ffffff" font-size="14">- Wait 30s between restarts (Telegram session lifetime).</text>
  <text x="24" y="460" fill="#ffffff" font-size="14">- DCs are geo-distributed: 149.154.166.110 works from BR,</text>
  <text x="36" y="480" fill="#ffffff" font-size="14">.50 and 91.108.56.130 may TLS-fail.</text>
  <text x="24" y="504" fill="#ffffff" font-size="14">- Use `getMe` (HTTP 200) to verify bot identity before</text>
  <text x="36" y="524" fill="#ffffff" font-size="14">diagnosing deeper issues.</text>
