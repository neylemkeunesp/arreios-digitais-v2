<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" font-family="-apple-system,system-ui,sans-serif">
  <defs>
    <linearGradient id="tg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="1" stop-color="#0e1621"/>
    </linearGradient>
    <linearGradient id="bubble-out" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5278"/>
      <stop offset="1" stop-color="#3a6ea5"/>
    </linearGradient>
  </defs>
  <rect width="500" height="700" fill="url(#tg-bg)"/>

  <!-- header -->
  <rect width="500" height="64" fill="#17212b"/>
  <text x="64" y="30" fill="#ffffff" font-size="15" font-weight="600">Yenclawreitoria</text>
  <text x="64" y="48" fill="#7c8a99" font-size="12">bot · last seen recently</text>
  <circle cx="32" cy="32" r="20" fill="#5e81ac"/>
  <text x="32" y="38" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Y</text>

  <!-- date divider -->
  <rect x="200" y="84" width="100" height="24" rx="12" fill="#1d2731"/>
  <text x="250" y="100" text-anchor="middle" fill="#7c8a99" font-size="12">28 September</text>

  <!-- user message -->
  <rect x="40" y="124" width="380" height="48" rx="14" fill="url(#bubble-out)"/>
  <text x="56" y="150" fill="#ffffff" font-size="14">olá, você está aí?</text>
  <text x="406" y="166" text-anchor="end" fill="#9ec3e6" font-size="10">21:32 ✓✓</text>

  <!-- bot response 1 -->
  <rect x="40" y="186" width="420" height="68" rx="14" fill="#182533"/>
  <text x="56" y="212" fill="#ffffff" font-size="14">Olá Ney! Estou sim. Acabei de</text>
  <text x="56" y="232" fill="#ffffff" font-size="14">consertar o voice playback — agora</text>
  <text x="56" y="252" fill="#ffffff" font-size="14">uso voz Francisca pt-BR via Edge TTS.</text>

  <!-- user command -->
  <rect x="40" y="270" width="180" height="36" rx="14" fill="url(#bubble-out)"/>
  <text x="56" y="293" fill="#ffffff" font-size="14">/status</text>

  <!-- bot response 2 - rich card -->
  <rect x="40" y="320" width="420" height="180" rx="14" fill="#182533"/>
  <text x="56" y="346" fill="#6ab2f2" font-size="13" font-weight="600">📊 Status do sistema</text>
  <text x="56" y="370" fill="#aebbcb" font-size="12">Gateway: ✓ connected</text>
  <text x="56" y="390" fill="#aebbcb" font-size="12">Telegram: ✓ polling 149.154.166.110</text>
  <text x="56" y="410" fill="#aebbcb" font-size="12">Whisper: ✓ faster-whisper base</text>
  <text x="56" y="430" fill="#aebbcb" font-size="12">TTS: ✓ Edge / pt-BR-FranciscaNeural</text>
  <text x="56" y="450" fill="#aebbcb" font-size="12">Skills: 118 bundled + 14 custom</text>
  <text x="56" y="470" fill="#aebbcb" font-size="12">Memory: 3 tiers · 1247 sessions</text>
  <text x="56" y="490" fill="#56d364" font-size="12">● Tudo operacional</text>

  <!-- typing indicator -->
  <rect x="40" y="520" width="64" height="36" rx="14" fill="#182533"/>
  <circle cx="58" cy="538" r="3" fill="#7c8a99"/>
  <circle cx="72" cy="538" r="3" fill="#7c8a99"/>
  <circle cx="86" cy="538" r="3" fill="#7c8a99"/>

  <!-- input bar -->
  <rect x="0" y="650" width="500" height="50" fill="#17212b"/>
  <rect x="16" y="662" width="468" height="26" rx="13" fill="#0e1621" stroke="#2b3a4a"/>
  <text x="32" y="680" fill="#7c8a99" font-size="13">Message</text>
</svg>