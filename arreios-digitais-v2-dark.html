<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="o-que-um-llm-cru-n%C3%A3o-faz">O que um LLM cru não faz</h1>
<p>Um modelo de linguagem treinado <strong>não é um agente</strong>. Ele:</p>
<ol>
<li><strong>Esquece tudo</strong> entre conversas — começa do zero a cada prompt</li>
<li><strong>Não vê seus arquivos</strong> — não tem filesystem, não tem contexto de projeto</li>
<li><strong>Não executa ações</strong> — não roda comandos, não lê e-mail, não agenda reunião</li>
<li><strong>Alucina com confiança</strong> — inventa paths, APIs, fatos, clientes</li>
<li><strong>Não aprende com erros</strong> — amanhã repete o mesmo bug de hoje</li>
</ol>
<blockquote>
<p>Sem ajuda externa, o LLM é um autocomplete glorificado.</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" data-marpit-pagination="3" style="--paginate:true;--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;" data-marpit-pagination-total="44" data-size="16:9">
<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="llms-%E2%86%92-harness-a-virada">LLMs → Harness: a virada</h1>
<p>De usar LLM <strong>como ferramenta</strong> a construir LLM <strong>como agente</strong> num sistema que orquestra.</p>
<table>
<thead>
<tr>
<th>Antes (v1)</th>
<th>Agora (v2)</th>
</tr>
</thead>
<tbody>
<tr>
<td>Skills isoladas por ferramenta</td>
<td><strong>Skill libraries</strong> com padronização <code>agentskills.io</code></td>
</tr>
<tr>
<td>Gateway Telegram único</td>
<td><strong>Gateway multiplex</strong> servindo 6+ canais (Telegram, Slack, Discord, WhatsApp, Signal, CLI)</td>
</tr>
<tr>
<td>&quot;Faz o prompt direito&quot;</td>
<td><strong>Harness Engineering</strong> virou a 4ª paradigma da engenharia de IA</td>
</tr>
<tr>
<td>Autoedição ad-hoc</td>
<td><strong>Ratchet pattern</strong>: cada falha vira nova regra versionada</td>
</tr>
<tr>
<td>1 agente por tarefa</td>
<td><strong>Sub-agentes, planejamento recursivo, loops Ralph</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>De <strong>&quot;como eu ensino o modelo&quot;</strong> → <strong>&quot;como eu projeto o sistema ao redor do modelo&quot;</strong>.</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" data-marpit-pagination="4" style="--paginate:true;--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;" data-marpit-pagination-total="44" data-size="16:9">
<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="os-5-ingredientes-que-transformam-llm-em-agente">Os 5 ingredientes que transformam LLM em agente</h1>
<p>Para cada limite, um ingrediente resolve:</p>
<table>
<thead>
<tr>
<th>Limite do LLM</th>
<th>Ingrediente que resolve</th>
</tr>
</thead>
<tbody>
<tr>
<td>Esquece entre conversas</td>
<td><strong>Memória persistente</strong> em camadas (3 tiers)</td>
</tr>
<tr>
<td>Não vê seus arquivos</td>
<td><strong>Ferramentas</strong> — terminal, browser, MCP, file edit</td>
</tr>
<tr>
<td>Não executa ações</td>
<td><strong>Skills</strong> — procedimentos reutilizáveis versionados</td>
</tr>
<tr>
<td>Alucina com confiança</td>
<td><strong>Contexto</strong> estruturado (AGENTS.md, contexto da tarefa)</td>
</tr>
<tr>
<td>Não aprende com erros</td>
<td><strong>Eval loop</strong> — cada falha vira teste, depois regra</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Quando esses 5 ingredientes se compõem, o LLM deixa de ser autocomplete e vira ferramenta.</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" data-marpit-pagination="5" style="--paginate:true;--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;" data-marpit-pagination-total="44" data-size="16:9">
<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="da-combina%C3%A7%C3%A3o-nasce-o-harness">Da combinação nasce o harness</h1>
<p>LLM sozinho = autocomplete.<br />
LLM + 5 ingredientes = ferramenta útil.<br />
<strong>LLM + 5 ingredientes + orquestração contínua = agente.</strong></p>
<p>Esse sistema ao redor do modelo é o <strong>harness</strong>. E em 2026, a engenharia de harness virou a alavanca mais importante da IA — 6× mais impacto que trocar o modelo, segundo Stanford/Tsinghua.</p>
<blockquote>
<p>A pergunta deixou de ser <em>&quot;qual modelo usar&quot;</em> e virou <em>&quot;como projetar o sistema que envolve o modelo&quot;</em>.</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" data-marpit-pagination="6" style="--paginate:true;--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;" data-marpit-pagination-total="44" data-size="16:9">
<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="o-meu-dia-a-dia-exige-mais-que-um-llm">O meu dia a dia exige mais que um LLM</h1>
<p>Sou CIO da UNESP, professor, pesquisador. Minhas demandas misturam domínios que <strong>um único LLM nu não dá conta</strong>:</p>
<table>
<thead>
<tr>
<th>Domínio</th>
<th>Exemplo real</th>
<th>Por que o LLM sozinho não basta</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Programação</strong></td>
<td>PRs em Rust, debug de drivers, code review</td>
<td>Precisa ler arquivos, rodar testes, abrir PR</td>
</tr>
<tr>
<td><strong>Burocracia</strong></td>
<td>Ofícios à RNP, editais de licitação, convênios</td>
<td>Precisa de templates, prazos, contexto institucional</td>
</tr>
<tr>
<td><strong>Física/Matemática</strong></td>
<td>Simulações, equações, papers, notas de aula</td>
<td>Precisa de LaTeX, plots, bibliografia</td>
</tr>
<tr>
<td><strong>Bioinformática</strong></td>
<td>Pipelines de sequenciamento, BLAST, phylogenia</td>
<td>Precisa de datasets reais e ferramentas específicas</td>
</tr>
<tr>
<td><strong>Gestão/CTInf</strong></td>
<td>Atas, escalas, chamados, planejamento</td>
<td>Precisa de Notion, calendário, mensagens</td>
</tr>
<tr>
<td><strong>Sysadmin</strong></td>
<td>Diagnóstico de crash, drivers NVIDIA, network</td>
<td>Precisa de terminal, journald, ssh</td>
</tr>
<tr>
<td><strong>Vida financeira</strong></td>
<td>Imposto de renda, investimentos, orçamento pessoal</td>
<td>Precisa de planilhas, regras fiscais atualizadas, contexto familiar</td>
</tr>
<tr>
<td><strong>Cultura</strong></td>
<td>Notas sobre cinema, livros, design</td>
<td>Precisa de contexto do meu gosto pessoal</td>
</tr>
<tr>
<td><strong>Bots/agentes</strong></td>
<td>Bot Telegram, perfis de agentes</td>
<td>Precisa de long-running processes</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Cada linha dessa tabela tem <strong>contexto proprietário, ferramentas específicas, e regras que mudam com o tempo</strong>. Um único prompt não carrega tudo isso.</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" data-marpit-pagination="7" style="--paginate:true;--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;" data-marpit-pagination-total="44" data-size="16:9">
<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="parte-1--contexto-introdut%C3%B3rio">Parte 1 — Contexto introdutório</h1>
<p>Como chegamos aqui? A IA em 2026 vive quatro ondas simultâneas.</p>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" data-marpit-pagination="8" style="--paginate:true;--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;" data-marpit-pagination-total="44" data-size="16:9">
<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="as-quatro-paradigmas-da-engenharia-de-ia">As quatro paradigmas da engenharia de IA</h1>
<table>
<thead>
<tr>
<th>#</th>
<th>Paradigma</th>
<th>Foco</th>
<th>Quando</th>
</tr>
</thead>
<tbody>
<tr>
<td>1</td>
<td><strong>Prompt Engineering</strong></td>
<td>Como falar com o modelo</td>
<td>2022–2023</td>
</tr>
<tr>
<td>2</td>
<td><strong>Context Engineering</strong></td>
<td>O que o modelo vê em cada chamada</td>
<td>2024</td>
</tr>
<tr>
<td>3</td>
<td><strong>Agent Engineering</strong></td>
<td>Tools, planning, memory, action</td>
<td>2024–2025</td>
</tr>
<tr>
<td>4</td>
<td><strong>Harness Engineering</strong></td>
<td>O sistema <strong>inteiro</strong> ao redor do modelo</td>
<td><strong>2026 →</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p>&quot;Agent = Model + Harness&quot; — Viv Trivedy, 2026</p>
</blockquote>
<blockquote>
<p>&quot;Harness engineering is the discipline of building the runtime control system around an AI agent.&quot; — aibuilderclub.com</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" data-marpit-pagination="9" style="--paginate:true;--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;" data-marpit-pagination-total="44" data-size="16:9">
<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="por-que-importou-agora">Por que importou agora?</h1>
<ul>
<li><strong>Anthropic</strong> publicou &quot;Effective harnesses for long-running agents&quot; (jan/2026)</li>
<li><strong>OpenAI</strong> escreveu &quot;Harness engineering: leveraging Codex in an agent-first world&quot; (fev/2026) — milionário de linhas de código sem humanos digitando</li>
<li><strong>Birgitta Böckeler</strong> (Thoughtworks) consolidou em martinfowler.com (fev/2026)</li>
<li><strong>Addy Osmani</strong> (Google) publicou &quot;Agent Harness Engineering&quot; (mai/2026)</li>
<li><strong>Stanford/Tsinghua</strong>: 6× de diferença de performance <strong>só pelo harness</strong>, mesmo modelo</li>
</ul>
<blockquote>
<p>O campo está se institucionalizando em meses, não anos.</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" data-marpit-pagination="10" style="--paginate:true;--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;" data-marpit-pagination-total="44" data-size="16:9">
<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="o-que-%C3%A9-harness-exatamente">O que é &quot;harness&quot; exatamente?</h1>
<blockquote>
<p><strong>Harness</strong> = o sistema que circunda o modelo e decide <strong>como ele pensa, planeja, age, percebe contexto, armazena artefatos e se autocorrige</strong>.</p>
</blockquote>
<p>Componentes canônicos (Lilian Weng, jul/2026):</p>
<table>
<thead>
<tr>
<th>Componente</th>
<th>Responsabilidade</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Context files</strong> (<code>AGENTS.md</code>, <code>CLAUDE.md</code>)</td>
<td>&quot;README para agentes&quot; — convenções, comandos, regras</td>
</tr>
<tr>
<td><strong>Skills</strong></td>
<td>Prompts + tools + docs invocáveis sob demanda</td>
</tr>
<tr>
<td><strong>Tools/MCP</strong></td>
<td>Interface padronizada com mundo externo</td>
</tr>
<tr>
<td><strong>Sub-agents</strong></td>
<td>Divisão de tarefas longas em paralelas</td>
</tr>
<tr>
<td><strong>Hooks</strong></td>
<td>Ganchos de validação (pre/post tool use)</td>
</tr>
<tr>
<td><strong>Memory/Playbooks</strong></td>
<td>Contexto como <strong>playbook</strong> que evolui (ACE, MCE)</td>
</tr>
<tr>
<td><strong>Eval loop</strong></td>
<td>Verificação automática de qualidade</td>
</tr>
<tr>
<td><strong>Sandbox + Permissions</strong></td>
<td>Limites do que o agente pode fazer</td>
</tr>
</tbody>
</table>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" data-marpit-pagination="11" style="--paginate:true;--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;" data-marpit-pagination-total="44" data-size="16:9">
<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="a-virada-o-modelo-virou-commodity">A virada: o modelo virou commodity</h1>
<p><strong>2018–2024</strong>: melhorar o modelo → melhorar tudo.<br />
<strong>2026</strong>: melhorar o <strong>harness</strong> → melhorar tudo.</p>
<p><img src="assets/model-vs-harness.png" alt="" style="width:1000px;" /></p>
<blockquote>
<p>&quot;The decisive engineering lever has permanently shifted from the model to the system built around it.&quot; — masood et al., TechTimes 2026</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" data-marpit-pagination="12" style="--paginate:true;--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;" data-marpit-pagination-total="44" data-size="16:9">
<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="o-padr%C3%A3o-ratchet">O padrão &quot;ratchet&quot;</h1>
<p><img src="assets/ratchet-pattern.png" alt="" style="width:1000px;" /></p>
<blockquote>
<p>&quot;Every failure becomes a new rule.&quot; — Böckeler, martinfowler.com</p>
</blockquote>
<p>É a <strong>alavanca de alavancagem</strong>: cada erro vira uma entrada permanente do playbook. O arreio <strong>se ajusta</strong> ao terreno depois de cada tropeço.</p>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" data-marpit-pagination="13" style="--paginate:true;--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;" data-marpit-pagination-total="44" data-size="16:9">
<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="caso-openaicodex--1m-de-linhas-zero-humanas">Caso OpenAI/Codex — 1M de linhas, zero humanas</h1>
<p>Ryan Lopopolo, OpenAI (fev/2026):</p>
<ul>
<li><strong>5 meses</strong> construindo um produto com 1M linhas</li>
<li><strong>0 linhas escritas por humanos</strong> (constraint deliberada)</li>
<li><strong>3 engenheiros</strong> mantendo <strong>3,5 PRs/dia cada</strong> (subiu para 7 com mesmo ritmo)</li>
<li><strong>1500 PRs</strong> mergeados</li>
<li><strong>1/10 do tempo</strong> comparado a escrita manual</li>
</ul>
<blockquote>
<p>O trabalho humano migrou de &quot;escrever código&quot; para &quot;projetar o ambiente onde o agente escreve código&quot;.</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" data-marpit-pagination="14" style="--paginate:true;--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;" data-marpit-pagination-total="44" data-size="16:9">
<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="os-3-loops-que-importam">Os 3 loops que importam</h1>
<p>Dois padrões de autoaprimoramento dominam 2026:</p>
<table>
<thead>
<tr>
<th>Loop</th>
<th>Quem usa</th>
<th>Como</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>ACE</strong> (Agentic Context Engineering)</td>
<td>Anthropic, muitos</td>
<td>Generator → Reflector → Curator mantêm um playbook vivo</td>
</tr>
<tr>
<td><strong>MCE</strong> (Meta Context Engineering)</td>
<td>Frontier labs</td>
<td>Cruza skills via <strong>crossover</strong> tipo algoritmo genético</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Hermes usa algo próximo do ACE nas skills: cada falha evolui uma <code>SKILL.md</code> em PR.</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" style="--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;--marpit-advanced-background-split:50%;" data-size="16:9" data-marpit-advanced-background="background" data-marpit-advanced-background-split="right"><div data-marpit-advanced-background-container="true" data-marpit-advanced-background-direction="horizontal"><figure style="background-image:url(&quot;assets/nous-girl-white.png&quot;);background-size:520px auto;"></figure></div></section></foreignObject><foreignObject width="50%" height="720"><section id="15" data-background-color="#1e1e2e" data-header="Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark" data-footer="Ney Lemke · UNESP · CTInf · 2026" data-theme="default" lang="en-US" style="--background-color:#1e1e2e;--header:Arreios Digitais Autoadaptativos e Multimodais · v2 · 🌙 dark;--footer:Ney Lemke · UNESP · CTInf · 2026;--theme:default;background-color:#1e1e2e;background-image:none;--marpit-advanced-background-split:50%;" data-size="16:9" data-marpit-advanced-background="content" data-marpit-advanced-background-split="right">

<h1 id="parte-2--hermes-o-arreio-concreto">Parte 2 — Hermes: o arreio concreto</h1>
<p>De teoria para a implementação que roda no seu laptop.</p>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>

<h1 id="o-que-%C3%A9-o-hermes-em-2026">O que é o Hermes em 2026?</h1>
<ul>
<li><strong>Agente open source MIT</strong> (Nous Research), <strong>v0.10 → v0.13</strong> (Tenacity Release)</li>
<li>70+ ferramentas built-in, 118 skills bundled</li>
<li><strong>6 canais de messaging</strong> num único gateway</li>
<li>Compatível com <code>agentskills.io</code> (padrão aberto)</li>
<li><strong>Modelo-agnóstico</strong>: Anthropic, OpenAI, OpenRouter, local (Ollama)</li>
</ul>
<blockquote>
<p>Lançado em fev/2026, é hoje o stack open-source de agentes que mais cresce.</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>

<h1 id="arquitetura-tr%C3%AAs-camadas">Arquitetura: três camadas</h1>
<p><img src="assets/architecture-flow.png" alt="" style="width:1100px;" /></p>
<blockquote>
<p><strong>6 canais de entrada</strong> convergem no <strong>gateway multiplex</strong> → <strong>harness</strong> orquestra o <strong>modelo</strong> e as <strong>ferramentas</strong>. <strong>Memory</strong> (3 tiers) e <strong>skills</strong> (<code>agentskills.io</code>) fecham o loop de feedback.</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>

<header>Arreios Digitais Autoadaptativos e Multimodais · v2 · <img class="emoji" draggable="false" alt="🌙" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f319.svg" data-marp-twemoji=""/> dark</header>
<h1 id="o-hermes-%C3%A9-um-harness-de-harness">O Hermes É um harness de harness</h1>
<p>A stack do Hermes implementa os 8 componentes canônicos:</p>
<table>
<thead>
<tr>
<th>Componente canônico</th>
<th>Implementação Hermes</th>
</tr>
</thead>
<tbody>
<tr>
<td>Context files</td>
<td><code>~/.hermes/AGENTS.md</code>, <code>SOUL.md</code>, profile-level</td>
</tr>
<tr>
<td>Skills</td>
<td><code>~/.hermes/profiles/&lt;p&gt;/skills/**/SKILL.md</code> (formato <code>agentskills.io</code>)</td>
</tr>
<tr>
<td>Tools/MCP</td>
<td>Tool Gateway + MCP catalog (Telegram, Discord, <strong>+15</strong>)</td>
</tr>
<tr>
<td>Sub-agents</td>
<td><code>delegate_task</code> + perfis isolados</td>
</tr>
<tr>
<td>Hooks</td>
<td>Webhooks + <code>pre/post</code> actions no config</td>
</tr>
<tr>
<td>Memory/Playbook</td>
<td>3-tier: core, session_search, providers externos</td>
</tr>
<tr>
<td>Eval loop</td>
<td><code>requesting-code-review</code> skill + GEPA</td>
</tr>
<tr>
<td>Sandbox/Perms</td>
<td><code>TELEGRAM_ALLOWED_USERS</code>, profile isolation</td>
</tr>
</tbody>
</table>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>

<h1 id="skills-mem%C3%B3ria-procedimental-versionada">Skills: memória procedimental versionada</h1>

<h1 id="mem%C3%B3ria-em-3-tiers">Memória em 3 tiers</h1>
<table>
<thead>
<tr>
<th>Tier</th>
<th>Onde</th>
<th>O que guarda</th>
<th>Latência</th>
</tr>
</thead>

<tr>

</tr>
<tr>

<td>Integração</td>
</tr>
</tbody>
</table>
<blockquote>
<p>Fatos críticos no Tier 1. Detalhes sob demanda nos demais. <strong>Memória profunda é opt-in, não default.</strong></p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>

<h1 id="omarchy-o-so-controlado-por-agentes">Omarchy: o SO controlado por agentes</h1>
<p>Omarchy (Arch Linux baseado) é o <strong>laboratório vivo</strong> do Hermes — cada componente do sistema é uma skill, e cada skill vira um comando que a IA pode invocar.</p>
<p><img src="assets/omarchy-control.png" alt="" style="width:1000px;" /></p>
<p><strong>Exemplos reais</strong> do que o agente faz no SO:</p>
<table>
<thead>
<tr>
<th>Pedido em linguagem natural</th>
<th>O que o agente executa</th>
</tr>
</thead>
<tbody>
<tr>
<td>&quot;instale CUDA&quot;</td>
<td><code>sudo pacman -S cuda nvidia-dkms</code> + valida driver</td>
</tr>
<tr>
<td>&quot;minha wifi caiu&quot;</td>
<td><code>journalctl -u NetworkManager</code> + diagnóstico + reconecta</td>
</tr>
<tr>
<td>&quot;troque a tecla SUPER+T&quot;</td>
<td>edita <code>~/.config/hypr/hyprland.conf</code> + <code>hyprctl reload</code></td>
</tr>
<tr>
<td>&quot;antes desse update, faz snapshot&quot;</td>
<td><code>btrfs snapshot create</code> + confirma</td>
</tr>
<tr>
<td>&quot;debug do driver NVIDIA&quot;</td>
<td><code>nvidia-smi</code> + journald + skill <code>diagnose-crash</code></td>
</tr>
</tbody>
</table>
<blockquote>
<p>O SO vira <strong>manipulável por conversa</strong>. Cada dotfile, serviço e pacote é uma tool que o agente conhece — e cada erro vira uma nova regra persistida em <code>AGENTS.md</code>.</p>
</blockquote>
<footer>Ney Lemke · UNESP · CTInf · 2026</footer>
</section>
